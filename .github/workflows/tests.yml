name: Tests
permissions:
  contents: read
  actions: read
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_run:
    workflows: ["Awesome Lint", "Build Category"]
    types:
      - completed
jobs:
  check-workflows:
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Fetch latest workflow runs
        id: get_runs
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const requiredWorkflows = ["Awesome Lint", "Build Category"];
            // Both checks remain mandatory and must pass for this exact commit.
            const sha = context.payload.pull_request?.head.sha
              ?? context.payload.workflow_run?.head_sha ?? context.sha;
            let failed = true;
            for (let attempt = 0; attempt < 18; attempt++) {
              const { data: runs } = await github.rest.actions.listWorkflowRunsForRepo({
                owner: context.repo.owner, repo: context.repo.repo, per_page: 100
              });
              const required = requiredWorkflows.map(name => runs.workflow_runs.find(
                run => run.name === name && run.head_sha === sha
              ));
              if (required.every(run => run?.status === "completed")) {
                failed = required.some(run => run.conclusion !== "success");
                break;
              }
              if (attempt < 17) await new Promise(resolve => setTimeout(resolve, 10000));
            }
            core.setOutput("failed", failed);
      - name: ❌ Fail if any workflow failed
        if: steps.get_runs.outputs.failed == 'true'
        run: |
          echo "One or more required workflows failed."
          exit 1
      - name: ✅ All workflows passed
        if: steps.get_runs.outputs.failed != 'true'
        run: echo "All required workflows passed."